name: Manual refund launch safety
on:
  pull_request:
    paths:
      - 'api/creem-webhook.js'
      - 'scripts/test-manual-refund-launch-gate.mjs'
      - '.github/workflows/manual-refund-launch-safety.yml'
  workflow_dispatch:
jobs:
  manual-refund-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check manual refund guard
        run: node scripts/test-manual-refund-launch-gate.mjs
