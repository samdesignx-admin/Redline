name: Creem refund amount webhook regression
on:
  pull_request:
    paths:
      - 'api/creem-webhook.js'
      - 'scripts/test-creem-refund-amounts.mjs'
      - '.github/workflows/creem-refund-amount-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-webhook-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify refund amount and currency gates without external services
        run: node scripts/test-creem-refund-amounts.mjs
