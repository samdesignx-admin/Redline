name: Authentication atomic replay release gate
on:
  pull_request:
    paths:
      - 'api/verify.js'
      - 'tests/auth-atomic-replay-gate.test.mjs'
      - '.github/workflows/auth-atomic-replay-gate.yml'
  workflow_dispatch:
jobs:
  auth-atomic-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run static release gates (expected red until fixed)
        run: node --test tests/auth-atomic-replay-gate.test.mjs
