name: Google OAuth claims regression
on:
  pull_request:
    paths:
      - 'api/account.js'
      - 'api/_google-claims.js'
      - 'scripts/verify-google-oauth-claims.mjs'
      - '.github/workflows/google-oauth-claims.yml'
  workflow_dispatch:
jobs:
  google-claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-google-oauth-claims.mjs
