name: Creem refund replay regression (release blocker)
on:
  pull_request:
    paths:
      - 'api/creem-webhook.js'
      - 'scripts/test-creem-refund-replay-stateful.mjs'
      - '.github/workflows/creem-refund-replay-regression.yml'
      - 'docs/sql/creem-refund-event-atomic-DRAFT.sql'
      - 'docs/sql/creem-refund-event-regression.sql'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refund-replay-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stateful replay regression (must pass before release)
        run: node scripts/test-creem-refund-replay-stateful.mjs
  refund-sql-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_test_only
          POSTGRES_DB: refund_regression
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d refund_regression"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: disposable_test_only
      PGDATABASE: refund_regression
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create disposable schema and Supabase role fixtures
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE TABLE public.creem_refund_events (
            event_id text PRIMARY KEY,
            refund_id text NOT NULL,
            transaction_id text,
            amount_cents integer,
            currency text,
            transaction_status text,
            refund_status text,
            state text NOT NULL,
            detail text,
            updated_at timestamptz NOT NULL DEFAULT now()
          );
          SQL
      - name: Apply draft RPC to disposable PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f docs/sql/creem-refund-event-atomic-DRAFT.sql
      - name: Run sequential refund SQL regression
        run: psql -v ON_ERROR_STOP=1 -f docs/sql/creem-refund-event-regression.sql
      - name: Assert RPC execution grants
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT has_function_privilege('service_role', 'public.record_creem_refund_event(text,text,text,integer,text,text,text,text,text)', 'EXECUTE')
               OR has_function_privilege('anon', 'public.record_creem_refund_event(text,text,text,integer,text,text,text,text,text)', 'EXECUTE')
               OR has_function_privilege('authenticated', 'public.record_creem_refund_event(text,text,text,integer,text,text,text,text,text)', 'EXECUTE')
            THEN
              RAISE EXCEPTION 'Refund RPC execute grants violate least privilege';
            END IF;
          END $$;
          SQL
