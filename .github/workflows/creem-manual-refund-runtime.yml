name: Creem manual refund runtime
on:
  pull_request:
    paths:
      - 'api/creem-webhook.js'
      - 'scripts/test-creem-manual-refund-runtime.mjs'
      - '.github/workflows/creem-manual-refund-runtime.yml'
  workflow_dispatch:
jobs:
  refund-webhook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/test-creem-manual-refund-runtime.mjs
