name: Free beta copy guard
on:
  pull_request:
    paths:
      - 'src/config/app.js'
      - 'scripts/verify-free-beta-copy.mjs'
      - '.github/workflows/free-beta-copy.yml'
  workflow_dispatch:
jobs:
  verify-free-beta-copy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify free beta copy without production access
        run: node scripts/verify-free-beta-copy.mjs
